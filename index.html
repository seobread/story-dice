function safeSettings(raw){const out=clone(DEFAULTS);if(!raw||typeof raw!=='object')return out;for(const k of ['labels','speech','sound','motion','writing','drawing','allowSolo','allowPair','allowGroup','timer'])if(typeof raw[k]==='boolean')out[k]=raw[k];if([2,3,5].includes(raw.count))out.count=raw.count;if(Array.isArray(raw.pairCats)){const a=[...new Set(raw.pairCats)].filter(c=>CATEGORY_IDS.includes(c));if(a.length===2)out.pairCats=a;}out.timerSeconds=Math.min(3600,Math.max(10,Number(raw.timerSeconds)||180));out.groupSize=Math.min(6,Math.max(3,Math.round(Number(raw.groupSize)||3)));for(const c of CATEGORY_IDS){const a=raw.enabled?.[c];if(Array.isArray(a)){const b=[...new Set(a)].filter(id=>LISTS[c].some(x=>x[0]===id));if(b.length)out.enabled[c]=b;}}if(!out.allowSolo&&!out.allowPair&&!out.allowGroup)out.allowSolo=true;return out;}

function safeDraft(raw){if(!raw||typeof raw!=='object'||!raw.cards||typeof raw.cards!=='object')return null;const out=newDraft();out.id=typeof raw.id==='string'&&raw.id.length<100?raw.id:uid();for(const k of ['created','updated'])out[k]=Number.isFinite(raw[k])&&raw[k]>0?raw[k]:Date.now();if([2,3,5].includes(raw.count))out.count=raw.count;if(Array.isArray(raw.pairCats)){const a=[...new Set(raw.pairCats)].filter(c=>CATEGORY_IDS.includes(c));if(a.length===2)out.pairCats=a;}if(MODES[raw.mode])out.mode=raw.mode;out.groupSize=Math.max(3,Math.min(6,Math.round(Number(raw.groupSize)||3)));out.turn=Math.max(0,Math.round(Number(raw.turn)||0))%6;for(const c of CATEGORY_IDS){if(LISTS[c].some(x=>x[0]===raw.cards[c]))out.cards[c]=raw.cards[c];out.locks[c]=!!raw.locks?.[c]&&!!out.cards[c];}for(const k of ['title','text','begin','middle','end'])out[k]=typeof raw[k]==='string'?raw[k].slice(0,k==='title'?80:6000):'';out.writeMode=raw.writeMode==='structured'?'structured':'free';if(Array.isArray(raw.strokes))out.strokes=raw.strokes.slice(0,250).flatMap(s=>{if(!s||!Array.isArray(s.points))return [];const points=s.points.slice(0,600).filter(p=>Array.isArray(p)&&p.length===2&&p.every(n=>Number.isFinite(n)&&n>=0&&n<=1));if(!points.length)return [];return [{color:COLORS.some(c=>c[1]===s.color)?s.color:COLORS[0][1],width:[4,8,14].includes(s.width)?s.width:8,erase:s.erase===true,points}];});return out;}

function putStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));storageProblem=false;$('#storage-status').textContent='이 브라우저에 저장했어요';return true;}catch(e){storageProblem=true;$('#storage-status').textContent='저장하지 못했어요 · 백업을 받아 주세요';return false;}}
function persistDraft(){clearTimeout(saveTimeout);draft.updated=Date.now();const ok=putStore(KEYS.draft,draft);if(!ok&&!storageWarningShown){storageWarningShown=true;toast('저장 공간이 부족하거나 저장이 막혀 있어요. 보관함에서 백업을 받아 주세요.');}return ok;}

function welcomeHTML(){return `<section class="welcome"><div class="welcome-copy"><span class="badge">${icon('star')} 그림으로 여는 이야기 놀이터</span><h1>상상 톡톡!<span>이야기 주사위</span></h1><p class="intro">주사위를 데굴데굴,<br>우리의 이야기가 피어나요.</p><div class="welcome-buttons">${btn('start','시작하기','dice','primary big')}${hasActivity()?btn('continue','이어서 하기','book','secondary small'):''}</div><div class="button-row" style="justify-content:flex-start;margin-top:19px">${btn('guide','어떻게 놀까요?','help','small soft')}</div></div><div class="welcome-art" aria-hidden="true"><div class="art-circle"></div><span class="hello-bubble">어떤 이야기가 기다릴까?</span><div class="mascot">${svgWrap(animal('rabbit')+`<g transform="translate(39 107) scale(.61 .35)">${objectArt('book')}</g>`)}</div><div class="mini-float one">${art('what','balloon',false)}풍선</div><div class="mini-float two">${art('where','forest',false)}숲</div><div class="mini-float three">${art('what','star',false)}반짝이는 별</div></div></section><div class="welcome-steps"><div class="welcome-step"><span class="step-symbol">${icon('dice')}</span><div><strong>그림을 뽑고</strong><small>주사위가 선물하는 작은 힌트</small></div></div><div class="welcome-step"><span class="step-symbol">${icon('people')}</span><div><strong>이야기를 나누고</strong><small>혼자서도, 친구와 함께도</small></div></div><div class="welcome-step"><span class="step-symbol">${icon('book')}</span><div><strong>작품으로 남겨요</strong><small>말로, 글로, 그림으로 표현해요</small></div></div></div>`;}
function setupHTML(){return `${steps(0)}<div class="page-heading"><h1>오늘은 어떻게 이야기할까요?</h1><p>마음에 드는 방법을 골라요.</p></div><section class="setup-panel"><h2>그림은 몇 장을 뽑을까요?</h2><div class="choice-row">${[2,3,5].map(n=>`<button class="choice ${draft.count===n?'selected':''}" data-act="count" data-count="${n}" aria-pressed="${draft.count===n}"><span class="card-dots" aria-hidden="true">${'<i></i>'.repeat(n)}</span>그림 ${n===2?'두':n===3?'세':'다섯'} 장</button>`).join('')}</div><h2>누구와 함께할까요?</h2><div class="choice-row">${Object.entries(MODES).filter(([m])=>settings['allow'+m[0].toUpperCase()+m.slice(1)]).map(([m,t])=>`<button class="choice ${draft.mode===m?'selected':''}" data-act="mode" data-mode="${m}" aria-pressed="${draft.mode===m}">${icon(m==='solo'?'book':'people')}<span>${m==='solo'?'혼자':m==='pair'?'짝과 함께':'모둠과 함께'}</span></button>`).join('')}</div>${draft.mode==='group'?`<label class="inline-field">우리 모둠은 <select id="group-size" aria-label="모둠 인원">${[3,4,5,6].map(n=>`<option value="${n}" ${draft.groupSize===n?'selected':''}>${n}명</option>`).join('')}</select></label>`:''}<div class="center">${btn('go-play','그림 뽑으러 가요','dice','primary big')}</div></section>`;}

function helpHTML(){return `<section class="help-strip" aria-label="이야기 도움">${btn('question','생각이 안 나요','help','soft')}${btn('sentences',showSentences?'문장 도움 접기':'첫 문장 도와줘요','book','secondary',`aria-expanded="${showSentences}"`)}${helpIndex>=0?`<p class="help-answer" role="status">${QUESTIONS[helpIndex]}</p>`:''}${showSentences?'<div class="sentence-list"><span>어느 날, ______.</span><span>그때 갑자기 ______.</span><span>그래서 ______.</span><span>마침내 ______.</span></div>':''}</section>`;}
function storyHTML(){return `${steps(2)}<div class="page-heading"><h1>우리만의 이야기를 들려줘요.</h1><p>말로 해도, 글로 써도, 그림으로 그려도 좋아요.</p></div>${miniHTML()}${turnHTML()}${timerHTML()}${helpHTML()}${settings.writing?writingHTML():''}${settings.drawing?drawingHTML():''}<div class="button-row">${btn('back-play','그림 다시 보기','dice','secondary')}${btn('finish','이야기 완성!','star','primary big')}</div>`;}
function writingHTML(){return `<section class="work-panel" aria-label="이야기 쓰기"><h2>글로 남겨 볼까요?</h2><p class="hint">말로만 이야기해도 괜찮아요.</p><label class="field-label" for="story-title">이야기 이름</label><input id="story-title" class="title-input" data-field="title" maxlength="80" value="${esc(draft.title)}" placeholder="이야기 이름을 붙여요" autocomplete="off"><div class="write-tabs" role="group" aria-label="글쓰기 방법"><button data-act="write-mode" data-mode="free" class="${draft.writeMode==='free'?'selected':''}" aria-pressed="${draft.writeMode==='free'}">자유롭게 쓰기</button><button data-act="write-mode" data-mode="structured" class="${draft.writeMode==='structured'?'selected':''}" aria-pressed="${draft.writeMode==='structured'}">처음 · 중간 · 끝</button></div><div id="writing-fields">${writingFields()}</div></section>`;}
function writingFields(){return draft.writeMode==='free'?`<label class="sr-only" for="free-story">내 이야기</label><textarea id="free-story" class="story-input" data-field="text" maxlength="6000" placeholder="어느 날, 어떤 일이 생겼을까요?">${esc(draft.text)}</textarea>`:`<div class="structured">${[['begin','처음','어느 날, ______.'],['middle','중간','그때 갑자기 ______.'],['end','끝','마침내 ______.']].map(([k,l,p])=>`<label class="field-label" for="story-${k}">${l}</label><textarea id="story-${k}" class="story-input" data-field="${k}" maxlength="6000" placeholder="${p}">${esc(draft[k])}</textarea>`).join('')}</div>`;}
function drawingHTML(){return `<section class="work-panel" aria-label="이야기 그림판"><h2>그림으로 펼쳐 볼까요?</h2><div class="draw-toolbar"><div class="color-list" role="group" aria-label="색 고르기">${COLORS.map(([n,c])=>`<button class="color-btn ${penColor===c&&!erasing?'selected':''}" style="--color:${c}" data-act="color" data-color="${c}" aria-label="${n}" title="${n}" aria-pressed="${penColor===c&&!erasing}"></button>`).join('')}</div><div class="brushes" role="group" aria-label="펜 굵기">${[[4,'가는 펜'],[8,'보통 펜'],[14,'굵은 펜']].map(([w,l])=>`<button class="brush-btn ${penWidth===w?'selected':''}" data-act="width" data-width="${w}" aria-label="${l}" aria-pressed="${penWidth===w}">${w===4?'가늘게':w===8?'보통':'굵게'}</button>`).join('')}</div><div class="draw-tools">${btn('eraser','지우개','eraser','soft small',`aria-pressed="${erasing}"`)}${btn('undo','되돌리기','undo','secondary small',!draft.strokes.length?'disabled':'')}${btn('clear-drawing','모두 지우기','trash','secondary small')}</div></div><div class="canvas-wrap"><canvas id="drawing" width="1200" height="700" tabindex="0" role="img" aria-label="이야기 그림판. 손가락이나 마우스로 그려요. 그림을 그리지 않고 글이나 말로 참여해도 됩니다."></canvas></div><p class="drawing-tip">손가락이나 마우스로 그려요. 화면을 돌려도 그림은 그대로예요.</p></section>`;}
function sheetHTML(d=draft){const body=d.writeMode==='structured'?['begin','middle','end'].map((k,i)=>`<h3>${['처음','중간','끝'][i]}</h3>${d[k].trim()?`<p class="sheet-text">${esc(d[k])}</p>`:'<div class="empty-writing">이곳에 이야기를 쓰거나 그림을 그려요.</div>'}`).join(''):(d.text.trim()?`<p class="sheet-text">${esc(d.text)}</p>`:'<div class="empty-writing">그림을 보며 나눈 이야기를 이곳에 남겨요.</div>');return `<article class="sheet"><h2>${esc(d.title.trim()||'우리의 상상 이야기')}</h2>${miniHTML(d)}${body}${d.strokes.length?`<img class="sheet-drawing" src="${drawingData(d.strokes)}" alt="내가 그린 이야기 그림">`:''}<p class="sheet-meta">상상 톡톡! 이야기 주사위 · ${new Date(d.created).toLocaleDateString('ko-KR')}</p></article>`;}
function doneHTML(){return `${steps(3)}<div class="page-heading"><span class="finished-badge">${icon('star')} 우리 이야기가 완성됐어요</span><h1>친구에게 들려줄까요?</h1><p>우리의 상상을 한 장에 담았어요.</p></div><div class="button-row">${btn('save','이 기기에 저장','save','primary')}${btn('print','인쇄 · PDF','print','secondary')}${btn('edit','더 만들기','pen','soft')}</div>${sheetHTML()}<div class="button-row">${btn('recent','내 이야기 보관함','folder','secondary')}${btn('new','새 이야기 만들기','dice','purple')}</div>`;}
function randomFrom(pool,previous,rng=Math.random){const candidates=pool.filter(id=>id!==previous);const a=candidates.length?candidates:pool;return a[Math.floor(rng()*a.length)];}
function rollResult(cards,locks,active,enabled,rng=Math.random){const next={...cards};for(const c of active)if(!locks[c])next[c]=randomFrom(enabled[c],cards[c],rng);return next;}
async function roll(only){if(busy)return;const active=only?[only]:cats();if(active.every(c=>draft.locks[c])){toast('모든 그림이 고정됐어요. 바꾸고 싶은 그림의 고정을 풀어 주세요.');return;}busy=true;renderPlayCards();beep('roll');await new Promise(resolve=>setTimeout(resolve,motionAllowed()?780:60));draft.cards=rollResult(draft.cards,draft.locks,active,settings.enabled);busy=false;changed(true);renderPlayCards();announce(active.map(c=>CATS[c].name+' '+label(c,draft.cards[c])).join(', '));}
function renderPlayCards(){if(stage!=='play')return;$('#cards-area').innerHTML=cardsHTML();const rollBtn=$('[data-act="roll"]');if(rollBtn){rollBtn.disabled=busy;rollBtn.innerHTML=icon('dice')+`<span>${busy?'데굴데굴…':allChosen()?'모두 다시':'주사위 굴리기'}</span>`;}const next=$('[data-act="go-story"]');if(next)next.disabled=!allChosen()||busy;}
function beep(kind){if(!settings.sound)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(()=>{});const notes=kind==='roll'?[523,659]:[523,659,784];notes.forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.18);});}catch(e){toast('이 기기에서는 효과음을 사용할 수 없어요. 활동은 계속할 수 있어요.');}}
function refreshVoices(){try{voices=window.speechSynthesis?.getVoices()||[];}catch(e){voices=[];}}
function speak(text){if(!settings.speech)return;if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){toast('이 기기는 낱말 읽기를 지원하지 않아요. 함께 읽어 주세요.');return;}refreshVoices();const korean=voices.find(v=>/^ko([_-]|$)/i.test(v.lang));if(!korean){toast('한국어 목소리를 찾지 못했어요. 그림을 보며 함께 읽어 주세요.');return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.voice=korean;u.rate=.83;u.volume=.85;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('낱말을 읽지 못했어요. 다른 기능은 계속 사용할 수 있어요.');};window.speechSynthesis.speak(u);}
function openModal(title,html){$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();}
function closeModal(){if(editSettings)editSettings=null;$('#modal').close();}
function confirmBox(title,message,choices=[['cancel','취소','secondary'],['ok','확인','primary']]){if($('#confirm').open)return Promise.resolve('cancel');$('#confirm-title').textContent=title;$('#confirm-message').textContent=message;$('#confirm-actions').innerHTML=choices.map(([id,text,cls])=>btn('confirm-choice',text,'',cls,`data-choice="${id}"`)).join('');$('#confirm').showModal();return new Promise(resolve=>confirmResolve=resolve);}
function finishConfirm(choice){$('#confirm').close();const resolve=confirmResolve;confirmResolve=null;resolve?.(choice);}
async function startNew(){if(busy)return;if(hasActivity()){const choice=await confirmBox('새 이야기를 만들까요?','지금 이야기를 보관함에 저장하고 새로 시작할 수 있어요.',[['cancel','계속 만들기','secondary'],['discard','저장 없이 새로','soft'],['save','저장하고 새로','primary']]);if(choice==='cancel')return;if(choice==='save'&&!saveStory())return;}draft=newDraft();dirty=false;helpIndex=-1;showSentences=false;resetTimer();persistDraft();setStage('setup');}
async function goHome(){if(busy)return;if(stage==='welcome')return;if(hasActivity()){const choice=await confirmBox('처음으로 돌아갈까요?','현재 활동을 이 브라우저에 남겨두고 돌아갑니다.',[['cancel','계속 만들기','secondary'],['ok','처음으로','primary']]);if(choice!=='ok')return;if(!persistDraft()){toast('활동이 저장되지 않았어요. 보관함에서 백업한 뒤 돌아가 주세요.');return;}}setStage('welcome');}
function saveStory(){if(!hasActivity()){toast('그림을 뽑거나 이야기를 만든 뒤 저장해 주세요.');return false;}draft.updated=Date.now();const next=saved.filter(s=>s.id!==draft.id);if(next.length>=30){toast('보관함에 30편이 있어요. 백업한 뒤 필요 없는 이야기를 지워 주세요.');return false;}next.unshift(clone(draft));if(!putStore(KEYS.saved,next)){toast('저장하지 못했어요. 보관함에서 백업 받기를 눌러 주세요.');return false;}saved=next;persistDraft();dirty=false;toast('내 이야기 보관함에 저장했어요.');return true;}
function openPicker(cat){pickerCat=cat;openModal(`${CATS[cat].name} · 그림을 골라요`,`<p class="modal-hint">그림을 고르면 자동으로 고정돼요.</p><div class="picker-grid">${LISTS[cat].filter(x=>settings.enabled[cat].includes(x[0])).map(([id,t])=>`<button class="picker-item" data-act="choose-card" data-cat="${cat}" data-id="${id}" aria-pressed="${draft.cards[cat]===id}">${art(cat,id)}<span class="${!settings.labels?'sr-only':''}">${t}</span>${draft.cards[cat]===id?'<span class="picked" aria-hidden="true">✓</span>':''}</button>`).join('')}</div>`);}
function refreshHelp(){const old=$('.help-strip');if(old)old.outerHTML=helpHTML();}
function updateTurn(){const old=$('#turn-panel');if(old)old.outerHTML=turnHTML();}
function formatTime(s){s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function updateTimerUI(){if(!$('#timer-value'))return;$('#timer-value').textContent=formatTime(timerRemaining);$('#timer-fill').style.width=`${Math.max(0,Math.min(100,timerRemaining/timerTotal*100))}%`;$('.timer-bar').setAttribute('aria-valuenow',String(Math.round(timerRemaining)));$('.timer-bar').setAttribute('aria-valuemax',String(timerTotal));$('#timer-toggle').textContent=timerRunning?'잠깐 멈춤':timerRemaining===0?'다시 시작':'시간 시작';}
function pauseTimer(){if(timerRunning)timerRemaining=Math.max(0,(timerEnd-Date.now())/1000);timerRunning=false;clearInterval(timerHandle);timerHandle=null;updateTimerUI();}
function resetTimer(){pauseTimer();timerRemaining=settings.timerSeconds;timerTotal=timerRemaining;updateTimerUI();}
function startTimer(){if(timerRemaining<=0){timerRemaining=settings.timerSeconds;timerTotal=timerRemaining;}timerRunning=true;timerEnd=Date.now()+timerRemaining*1000;clearInterval(timerHandle);timerHandle=setInterval(()=>{timerRemaining=Math.max(0,(timerEnd-Date.now())/1000);if(timerRemaining===0){pauseTimer();beep('done');toast('생각할 시간이 지났어요. 이야기는 계속해도 좋아요.');}updateTimerUI();},200);updateTimerUI();}
function drawStroke(ctx,s,w=1200,h=700){ctx.save();ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.width*(s.erase?4:1);ctx.lineCap='round';ctx.lineJoin='round';const p=s.points;if(p.length===1){ctx.beginPath();ctx.arc(p[0][0]*w,p[0][1]*h,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();}else{ctx.beginPath();ctx.moveTo(p[0][0]*w,p[0][1]*h);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0]*w,p[i][1]*h);ctx.stroke();}ctx.restore();}
function redraw(){if(!context)return;context.clearRect(0,0,1200,700);draft.strokes.forEach(s=>drawStroke(context,s));if(activeStroke)drawStroke(context,activeStroke);}
function drawingData(strokes){const c=document.createElement('canvas');c.width=1200;c.height=700;const ctx=c.getContext('2d');strokes.forEach(s=>drawStroke(ctx,s));ctx.globalCompositeOperation='destination-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,1200,700);return c.toDataURL('image/png');}
function pointerPoint(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];}
function bindCanvas(){canvas=$('#drawing');context=canvas.getContext('2d');if(!context){toast('이 브라우저에서는 그림판을 사용할 수 없어요. 말이나 글로 표현해 주세요.');return;}redraw();canvas.addEventListener('pointerdown',e=>{if((e.pointerType==='mouse'&&e.button!==0)||activeStroke)return;if(draft.strokes.length>=250){toast('그림이 가득 찼어요. 저장한 뒤 새 그림을 그려 주세요.');return;}e.preventDefault();activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);activeStroke={color:penColor,width:penWidth,erase:erasing,points:[pointerPoint(e)]};redraw();});canvas.addEventListener('pointermove',e=>{if(!activeStroke||e.pointerId!==activePointer)return;e.preventDefault();const p=pointerPoint(e),last=activeStroke.points.at(-1);if(Math.hypot((p[0]-last[0])*1200,(p[1]-last[1])*700)<1.5)return;activeStroke.points.push(p);if(activeStroke.points.length>580)activeStroke.points=activeStroke.points.filter((_,i)=>i%2===0||i===activeStroke.points.length-1);redraw();});canvas.addEventListener('pointerup',finishStroke);canvas.addEventListener('pointercancel',finishStroke);canvas.addEventListener('lostpointercapture',finishStroke);}
function finishStroke(){if(!activeStroke)return;draft.strokes.push(activeStroke);activeStroke=null;activePointer=null;changed(true);updateDrawTools();redraw();}
function updateDrawTools(){$$('.color-btn').forEach(b=>{const s=b.dataset.color===penColor&&!erasing;b.classList.toggle('selected',s);b.setAttribute('aria-pressed',String(s));});$$('.brush-btn').forEach(b=>{const s=Number(b.dataset.width)===penWidth;b.classList.toggle('selected',s);b.setAttribute('aria-pressed',String(s));});const e=$('[data-act="eraser"]');if(e)e.setAttribute('aria-pressed',String(erasing));const u=$('[data-act="undo"]');if(u)u.disabled=!draft.strokes.length;}
function openSettings(){pauseTimer();editSettings=clone(settings);libraryCat='who';openModal('선생님 설정',settingsHTML());}
function toggleSetting(k,text){return `<label class="setting-label"><span>${text}</span><input type="checkbox" data-setting="${k}" ${editSettings[k]?'checked':''}></label>`;}
function settingsHTML(){return `<p class="modal-hint">우리 반에 맞게 골라 주세요. 설정은 현재 브라우저에 저장돼요.</p><section class="settings-block"><h3>그림 카드</h3><div class="settings-grid"><label class="setting-label">기본 카드 수<select id="setting-count">${[2,3,5].map(n=>`<option value="${n}" ${editSettings.count===n?'selected':''}>${n}장</option>`).join('')}</select></label>${toggleSetting('labels','그림과 낱말 함께 보기')}${toggleSetting('speech','낱말 듣기 버튼 사용')}</div><p class="modal-hint">‘그림 두 장’에서 사용할 종류를 두 개 골라 주세요.</p><div class="check-cats">${CATEGORY_IDS.map(c=>`<label><input type="checkbox" data-pair-cat="${c}" ${editSettings.pairCats.includes(c)?'checked':''}>${CATS[c].name}</label>`).join('')}</div></section><section class="settings-block"><h3>활동과 표현</h3><div class="settings-grid">${toggleSetting('allowSolo','혼자 활동')}${toggleSetting('allowPair','짝 활동')}${toggleSetting('allowGroup','모둠 활동')}<label class="setting-label">기본 모둠 인원<select id="setting-group">${[3,4,5,6].map(n=>`<option value="${n}" ${editSettings.groupSize===n?'selected':''}>${n}명</option>`).join('')}</select></label>${toggleSetting('writing','글쓰기 사용')}${toggleSetting('drawing','그림판 사용')}</div></section><section class="settings-block"><h3>소리와 움직임</h3><div class="settings-grid">${toggleSetting('sound','효과음 사용')}${toggleSetting('motion','짧은 애니메이션 사용')}</div><p class="modal-hint">효과음과 낱말 듣기는 별도예요. 낱말 듣기는 한국어 음성을 제공하는 기기에서 사용할 수 있어요. 기기의 ‘동작 줄이기’ 설정도 따릅니다.</p></section><section class="settings-block"><h3>생각할 시간</h3><div class="settings-grid">${toggleSetting('timer','타이머 사용')}<label class="setting-label">시간 선택<select id="setting-time"><option value="60" ${editSettings.timerSeconds===60?'selected':''}>1분</option><option value="180" ${editSettings.timerSeconds===180?'selected':''}>3분</option><option value="300" ${editSettings.timerSeconds===300?'selected':''}>5분</option><option value="custom" ${![60,180,300].includes(editSettings.timerSeconds)?'selected':''}>직접 설정</option></select></label><label class="setting-label">직접 설정 (초)<input id="setting-seconds" type="number" min="10" max="3600" step="10" value="${editSettings.timerSeconds}"></label></div><p class="modal-hint">시간이 끝나도 활동은 계속할 수 있어요.</p></section><section class="settings-block"><h3>사용할 그림 고르기 · 80장</h3><p class="modal-hint">눌러서 포함하거나 제외해요. 각 종류에 최소 한 장은 남겨 주세요.</p><div class="library-cats">${CATEGORY_IDS.map(c=>`<button data-act="library-category" data-cat="${c}" class="${libraryCat===c?'selected':''}">${CATS[c].name}</button>`).join('')}</div><div id="library-grid">${libraryHTML()}</div></section><div class="settings-actions">${btn('settings-apply','설정 적용','check','primary')}${btn('settings-preset','카드 미리 골라두기','book','secondary')}${btn('close-modal','취소','','soft')}</div>`;}
function libraryHTML(){return `<div class="picker-grid">${LISTS[libraryCat].map(([id,l])=>{const on=editSettings.enabled[libraryCat].includes(id);return `<button class="picker-item ${on?'':'excluded'}" data-act="toggle-card" data-cat="${libraryCat}" data-id="${id}" aria-label="${l} ${on?'포함됨':'제외됨'}" aria-pressed="${on}">${art(libraryCat,id)}<span>${l}</span><span class="picked" aria-hidden="true">${on?'✓':'−'}</span></button>`;}).join('')}</div>`;}
function applySettings(preset=false){const pair=$$('[data-pair-cat]:checked').map(el=>el.dataset.pairCat);if(pair.length!==2){toast('그림 두 장에서 사용할 종류를 정확히 두 개 골라 주세요.');return;}$$('[data-setting]').forEach(el=>editSettings[el.dataset.setting]=el.checked);if(!editSettings.allowSolo&&!editSettings.allowPair&&!editSettings.allowGroup){toast('활동 방법을 한 가지 이상 켜 주세요.');return;}const seconds=$('#setting-time').value==='custom'?Number($('#setting-seconds').value):Number($('#setting-time').value);if(!Number.isFinite(seconds)||seconds<10||seconds>3600){toast('생각할 시간은 10~3600초로 입력해 주세요.');return;}editSettings.count=Number($('#setting-count').value);editSettings.groupSize=Number($('#setting-group').value);editSettings.timerSeconds=Math.round(seconds);editSettings.pairCats=pair;settings=safeSettings(editSettings);draft.count=settings.count;draft.pairCats=[...settings.pairCats];draft.groupSize=settings.groupSize;if(!settings['allow'+draft.mode[0].toUpperCase()+draft.mode.slice(1)])draft.mode=settings.allowSolo?'solo':settings.allowPair?'pair':'group';for(const c of CATEGORY_IDS){if(draft.cards[c]&&!settings.enabled[c].includes(draft.cards[c])){delete draft.cards[c];draft.locks[c]=false;}}saveSettings();changed(true);resetTimer();closeModal();if(preset||((stage==='story'||stage==='done')&&!allChosen()))setStage('play');else render();toast(preset?'‘직접 고르기’로 그림을 고르면 고정돼요.':'설정을 적용했어요.');}
function openRecent(){pauseTimer();openModal('내 이야기 보관함',recentHTML());}
function recentHTML(){return `<p class="modal-hint">이 브라우저에 저장한 이야기예요. 다른 기기에서는 백업 파일을 불러와 주세요.</p>${saved.length?saved.map(s=>`<article class="recent-item"><div class="recent-top"><div><h3>${esc(s.title.trim()||'우리의 상상 이야기')}</h3><small>${new Date(s.updated).toLocaleString('ko-KR')} · ${s.count}장</small></div><div class="recent-actions">${btn('load-story','이어서 만들기','book','secondary small',`data-id="${esc(s.id)}"`)}${btn('delete-story','삭제','trash','soft small',`data-id="${esc(s.id)}"`)}</div></div><div class="recent-cards">${cats(s).filter(c=>s.cards[c]).map(c=>`<span>${art(c,s.cards[c])}</span>`).join('')}</div></article>`).join(''):`<div class="empty-state">${icon('folder')}아직 저장한 이야기가 없어요.<br>완성한 뒤 ‘이 기기에 저장’을 눌러요.</div>`}<div class="backup-row">${btn('backup','백업 받기','download','secondary small')}${btn('import','백업 불러오기','folder','secondary small')}</div><p class="modal-hint">백업에는 현재 활동과 보관함 이야기가 함께 들어가요. 브라우저 데이터를 지우거나 파일 위치를 바꾸기 전에 백업해 주세요.</p>`;}
async function loadStory(id){if(busy)return;if(hasActivity()&&draft.id!==id){const choice=await confirmBox('다른 이야기를 열까요?','지금 만들던 이야기를 먼저 저장할 수 있어요.',[['cancel','취소','secondary'],['discard','바로 열기','soft'],['save','저장하고 열기','primary']]);if(choice==='cancel')return;if(choice==='save'&&!saveStory())return;}const selected=saved.find(s=>s.id===id);if(!selected)return;draft=clone(selected);dirty=false;persistDraft();closeModal();helpIndex=-1;showSentences=false;setStage('story');toast('이야기를 불러왔어요.');}
function backup(){try{persistDraft();const blob=new Blob([JSON.stringify({format:'sangsang-story-dice',version:1,exported:new Date().toISOString(),settings,draft,saved},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`이야기주사위_백업_${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('백업 파일 다운로드를 시작했어요.');}catch(e){toast('백업 파일을 만들지 못했어요. 작성한 글을 따로 복사해 주세요.');}}
async function importBackup(file){if(!file)return;if(file.size>12*1024*1024){toast('12MB보다 작은 이야기 주사위 백업 파일을 골라 주세요.');return;}let data;try{data=JSON.parse(await file.text());if(data.format!=='sangsang-story-dice'||data.version!==1||!Array.isArray(data.saved))throw Error();}catch(e){toast('이야기 주사위 백업 파일이 아니거나 손상됐어요.');return;}const incoming=data.saved.slice(0,30).map(safeDraft).filter(Boolean),d=safeDraft(data.draft);if(d&&hasActivity(d)&&!incoming.some(s=>s.id===d.id))incoming.unshift(d);if(!incoming.length){toast('불러올 이야기가 없어요.');return;}const choice=await confirmBox('백업을 불러올까요?','현재 활동은 유지합니다. 같은 이야기는 더 최근에 저장한 내용을 남깁니다.',[['cancel','취소','secondary'],['ok','불러오기','primary']]);if(choice!=='ok')return;const map=new Map(saved.map(s=>[s.id,s]));incoming.forEach(s=>{const old=map.get(s.id);if(!old||s.updated>old.updated)map.set(s.id,s);});const next=[...map.values()].sort((a,b)=>b.updated-a.updated);if(next.length>30){toast('보관함은 최대 30편이에요. 기존 이야기를 백업하고 정리한 뒤 다시 불러와 주세요.');return;}if(!putStore(KEYS.saved,next)){toast('공간이 부족해 불러오지 못했어요. 기존 보관함은 유지됩니다.');return;}saved=next;openRecent();toast(`${incoming.length}편을 확인해 보관함에 합쳤어요.`);}
function guide(){openModal('어떻게 놀까요?',`<div class="guide"><ol><li><strong>시작하기</strong>를 누르고 그림 수와 활동 방법을 골라요.</li><li><strong>주사위 굴리기</strong>로 그림을 만나요. 마음에 드는 카드는 ‘고정’해요.</li><li><strong>이야기 만들기</strong>를 누르고 그림을 연결해 말해요. 글과 그림은 선택이에요.</li><li><strong>이야기 완성!</strong>을 누르면 저장하거나 활동지로 인쇄할 수 있어요.</li></ol><p>선생님 설정에서 카드 포함·제외, 그림 두 장의 종류, 타이머, 글쓰기·그림판을 바꿀 수 있어요. ‘카드 미리 골라두기’를 누르면 수업 전에 그림을 직접 고정할 수 있어요.</p><p>저장 내용은 현재 브라우저에만 남아요. 다른 기기로 옮기거나 브라우저 데이터를 지우기 전에는 보관함에서 백업을 받아 주세요. 한국어 읽기는 기기의 한국어 음성 지원 여부에 따라 달라져요.</p><p>컴퓨터에서는 index.html을 Chrome 또는 Edge로 여세요. 태블릿에서는 GitHub Pages 같은 웹 주소로 접속하면 편리해요. 인쇄 창에서 대상을 ‘PDF로 저장’으로 고르면 PDF 파일로 남길 수 있어요.</p></div>`);}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;if(busy&&!['sound','speak','close-modal'].includes(a))return;switch(a){
case 'start':case 'new':await startNew();break;
case 'continue':setStage(allChosen()?'story':'play');break;
case 'home':await goHome();break;
case 'guide':guide();break;
case 'sound':settings.sound=!settings.sound;saveSettings();renderHeader();if(settings.sound)beep('roll');break;
case 'settings':openSettings();break;
case 'close-modal':closeModal();break;
case 'confirm-choice':finishConfirm(b.dataset.choice);break;
case 'count':draft.count=Number(b.dataset.count);draft.pairCats=[...settings.pairCats];changed();render();break;
case 'mode':draft.mode=b.dataset.mode;draft.turn=0;changed();render();break;
case 'go-play':changed(true);setStage('play');break;
case 'roll':await roll();break;
case 'reroll':await roll(b.dataset.cat);break;
case 'lock':draft.locks[b.dataset.cat]=!draft.locks[b.dataset.cat];changed();renderPlayCards();break;
case 'pick':openPicker(b.dataset.cat);break;
case 'choose-card':draft.cards[b.dataset.cat]=b.dataset.id;draft.locks[b.dataset.cat]=true;changed(true);closeModal();renderPlayCards();toast('그림을 골라서 고정했어요.');break;
case 'speak':speak(label(b.dataset.cat,draft.cards[b.dataset.cat]));break;
case 'go-story':if(allChosen())setStage('story');break;
case 'back-play':setStage('play');break;
case 'question':helpIndex=(helpIndex+1)%QUESTIONS.length;refreshHelp();break;
case 'sentences':showSentences=!showSentences;refreshHelp();break;
case 'turn':draft.turn=(draft.turn+1)%(draft.mode==='pair'?2:draft.groupSize);changed();updateTurn();announce(draft.mode==='pair'?(draft.turn===0?'내 차례':'친구 차례'):`${draft.turn+1}번 친구 차례`);break;
case 'think':pauseTimer();toast('천천히 생각해도 괜찮아요. 준비되면 차례를 바꿔요.');break;
case 'timer-toggle':timerRunning?pauseTimer():startTimer();break;
case 'timer-add':if(timerRunning){timerRemaining=Math.max(0,(timerEnd-Date.now())/1000)+60;timerEnd=Date.now()+timerRemaining*1000;}else timerRemaining+=60;timerTotal=Math.max(timerTotal,timerRemaining);updateTimerUI();break;
case 'timer-reset':resetTimer();break;
case 'write-mode':draft.writeMode=b.dataset.mode;changed();$('#writing-fields').innerHTML=writingFields();$$('[data-act="write-mode"]').forEach(el=>{const selected=el.dataset.mode===draft.writeMode;el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',String(selected));});break;
case 'color':penColor=b.dataset.color;erasing=false;updateDrawTools();break;
case 'width':penWidth=Number(b.dataset.width);updateDrawTools();break;
case 'eraser':erasing=!erasing;updateDrawTools();break;
case 'undo':draft.strokes.pop();changed(true);redraw();updateDrawTools();break;
case 'clear-drawing':if(!draft.strokes.length){toast('아직 그린 그림이 없어요.');break;}if(await confirmBox('그림을 모두 지울까요?','지운 그림은 되돌릴 수 없어요.',[['cancel','그대로 두기','secondary'],['ok','모두 지우기','primary']])==='ok'){draft.strokes=[];changed(true);redraw();updateDrawTools();}break;
case 'finish':persistDraft();setStage('done');beep('done');break;
case 'edit':setStage('story');break;
case 'save':saveStory();break;
case 'print':$('#print-root').innerHTML=sheetHTML();window.print();break;
case 'recent':openRecent();break;
case 'load-story':await loadStory(b.dataset.id);break;
case 'delete-story':if(await confirmBox('보관함에서 지울까요?','필요한 이야기는 먼저 백업해 주세요. 현재 만들던 활동은 지워지지 않아요.',[['cancel','취소','secondary'],['ok','보관함에서 삭제','primary']])==='ok'){const next=saved.filter(s=>s.id!==b.dataset.id);if(putStore(KEYS.saved,next)){saved=next;$('#modal-body').innerHTML=recentHTML();toast('보관함에서 삭제했어요.');}else toast('삭제 내용을 저장하지 못했어요. 보관함을 유지합니다.');}break;
case 'backup':backup();break;
case 'import':$('#import-file').click();break;
case 'settings-apply':applySettings(false);break;
case 'settings-preset':applySettings(true);break;
case 'library-category':libraryCat=b.dataset.cat;$$('[data-act="library-category"]').forEach(el=>el.classList.toggle('selected',el.dataset.cat===libraryCat));$('#library-grid').innerHTML=libraryHTML();break;
case 'toggle-card':{const c=b.dataset.cat,id=b.dataset.id,arr=editSettings.enabled[c];if(arr.includes(id)){if(arr.length===1){toast('각 종류에 그림 한 장 이상을 남겨 주세요.');break;}editSettings.enabled[c]=arr.filter(x=>x!==id);}else arr.push(id);$('#library-grid').innerHTML=libraryHTML();break;}
}});
document.addEventListener('input',e=>{const field=e.target.dataset.field;if(field&&['title','text','begin','middle','end'].includes(field)){draft[field]=e.target.value;changed();}});
document.addEventListener('change',e=>{if(e.target.id==='group-size'){draft.groupSize=Number(e.target.value);changed();}if(e.target.id==='setting-time'&&e.target.value!=='custom')$('#setting-seconds').value=e.target.value;if(e.target.id==='import-file'){importBackup(e.target.files[0]);e.target.value='';}});
$('#confirm').addEventListener('cancel',e=>{e.preventDefault();finishConfirm('cancel');});
$('#modal').addEventListener('cancel',()=>editSettings=null);
window.addEventListener('pagehide',()=>{pauseTimer();persistDraft();try{speechSynthesis.cancel();}catch(e){}});
window.addEventListener('beforeunload',e=>{if(storageProblem&&hasActivity()){e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persistDraft();});
window.addEventListener('beforeprint',()=>$('#print-root').innerHTML=sheetHTML());
if('speechSynthesis'in window){refreshVoices();speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);}
render();
if(initialWarnings.length)setTimeout(()=>toast(initialWarnings[0]),500);
</script>
</body></html>
